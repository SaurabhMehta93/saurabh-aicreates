<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Share Your Review – Saurabh AI Creates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header><div class="wrap nav">
  <a href="index.html" class="brand">SAURABH<span>.AICREATES</span></a>
</div></header>

<section><div class="wrap">
  <div class="sec-title"><span class="tag">Your Feedback</span><h2>How did we do?</h2><p>Thank you for choosing us. Your review helps us improve and helps other families trust us.</p></div>

  <form class="rv-box" id="rvForm" novalidate>
    <label for="name">Your name *</label>
    <input id="name" name="name" maxlength="80" required>

    <label for="contact">Instagram / WhatsApp (optional, only we see this)</label>
    <input id="contact" name="contact" maxlength="100">

    <label for="service">What did we make for you?</label>
    <select id="service" name="service">
      <option>Wedding Invitation</option><option>Birthday Invitation</option>
      <option>Family Story Video</option><option>Devotional Video</option><option>Other</option>
    </select>

    <label>Rating *</label>
    <div class="stars">
      <input type="radio" name="rating" id="r5" value="5"><label for="r5" title="Excellent">★</label>
      <input type="radio" name="rating" id="r4" value="4"><label for="r4" title="Good">★</label>
      <input type="radio" name="rating" id="r3" value="3"><label for="r3" title="Okay">★</label>
      <input type="radio" name="rating" id="r2" value="2"><label for="r2" title="Poor">★</label>
      <input type="radio" name="rating" id="r1" value="1"><label for="r1" title="Bad">★</label>
    </div>

    <label for="review">Your review *</label>
    <textarea id="review" name="review" maxlength="2000" required placeholder="What did you and your family like?"></textarea>

    <label for="suggestions">Anything we can improve? (private)</label>
    <textarea id="suggestions" name="suggestions" maxlength="2000"></textarea>

    <label class="rv-check"><input type="checkbox" id="allowPublic" checked> You can show my name and review on this page</label>

    <button class="btn btn-gold" type="submit" id="rvBtn">Submit Review</button>
    <div class="rv-msg" id="rvMsg"></div>
  </form>
</div></section>


<section id="rvWall" style="display:none"><div class="wrap">
  <div class="sec-title"><span class="tag">Happy Clients</span><h2>What Clients Say</h2></div>
  <div class="rv-list" id="rvList"></div>
</div></section>

<footer><div class="wrap"><div>© 2026 Saurabh AI Creates · All videos are AI-generated</div></div></footer>

<script>
(function(){
  // Google Form: Saurabh AI Creates – Review
  const FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSdsbw8XQ1eesN3e3HpwzW3NzgksC5vkUUw1iFFnKf7WfFTKgg/formResponse';
  const F = { name:'entry.162040263', contact:'entry.927989608', service:'entry.1763975307', rating:'entry.1838763120',
              review:'entry.2137173967', suggestions:'entry.1449254682', allowPublic:'entry.218398271' };
  const f = document.getElementById('rvForm'), msg = document.getElementById('rvMsg'), btn = document.getElementById('rvBtn');
  const say = (t, cls) => { msg.textContent = t; msg.className = 'rv-msg ' + (cls||''); };

  f.addEventListener('submit', async e => {
    e.preventDefault();
    const rating = (f.querySelector('input[name=rating]:checked')||{}).value;
    const name = f.name.value.trim(), review = f.review.value.trim();
    if (!name || !rating || !review) return say('Please add your name, a star rating and your review.', 'err');
    const body = new URLSearchParams();
    body.append(F.name, name);
    body.append(F.contact, f.contact.value.trim() || '-');
    body.append(F.service, f.service.value);
    body.append(F.rating, rating);
    body.append(F.review, review);
    body.append(F.suggestions, f.suggestions.value.trim() || '-');
    body.append(F.allowPublic, f.allowPublic.checked ? 'Yes' : 'No');
    btn.disabled = true; btn.textContent = 'Submitting…'; say('');
    try {
      await fetch(FORM, { method:'POST', mode:'no-cors', body });
      f.innerHTML = '<div class="sec-title" style="margin:0"><h2>Thank you! 🙏</h2><p>Your review has been received.</p></div>';
    } catch (err) {
      say('Could not submit right now. Please check your internet and try again.', 'err');
      btn.disabled = false; btn.textContent = 'Submit Review';
    }
  });
})();
</script>
<script src="assets/js/reviews.js"></script>
<script>renderReviews(document.getElementById('rvList'), document.getElementById('rvWall'), 30);</script>
</body>
</html>
