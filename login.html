<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin – Saurabh AI Creates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header><div class="wrap nav"><span class="brand">SAURABH<span>.AICREATES · ADMIN</span></span>
  <button class="btn btn-ghost btn-sm" id="logout" style="display:none;background:none;cursor:pointer">Logout</button></div></header>

<section id="loginSec"><div class="wrap">
  <div class="sec-title"><span class="tag">Restricted</span><h2>Admin Login</h2></div>
  <form class="rv-box" id="loginForm" style="max-width:420px">
    <label for="u">Username</label><input id="u" autocomplete="username" required>
    <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
    <button class="btn btn-gold" type="submit" id="lBtn">Login</button>
    <div class="rv-msg" id="lMsg"></div>
  </form>
</div></section>

<section id="dash" style="display:none"><div class="wrap">
  <div class="adm-bar">
    <div class="adm-stats" id="stats"></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost btn-sm" id="refresh" style="background:none;cursor:pointer">↻ Refresh</button>
      <button class="btn btn-gold btn-sm" id="csv" style="border:0;cursor:pointer">⬇ Download Excel (CSV)</button>
    </div>
  </div>
  <div class="tbl-wrap"><table class="adm">
    <thead><tr><th>Date</th><th>Name</th><th>Contact</th><th>Service</th><th>Rating</th><th>Review</th><th>Suggestions</th><th>Public OK</th><th>Show on site</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</div></section>

<script src="assets/js/reviews-config.js"></script>
<script>
(function(){
  const API = window.REVIEW_API_URL;
  const ADMIN_USER = 'saurabh', ADMIN_PASS = 'saurabh@93';
  let creds = null, data = [];
  try { creds = JSON.parse(sessionStorage.getItem('sac_admin')); } catch(e) {}
  const $ = id => document.getElementById(id);
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const post = body => fetch(API, { method:'POST', body:JSON.stringify(Object.assign({}, creds, body)) }).then(r => r.json());

  async function load(){
    const r = await post({ action:'list' });
    if (!r.ok) { logout(); $('lMsg').textContent = r.error; $('lMsg').className='rv-msg err'; return false; }
    data = r.reviews; render();
    $('loginSec').style.display='none'; $('dash').style.display=''; $('logout').style.display='';
    return true;
  }
  function render(){
    const n = data.length, avg = n ? (data.reduce((a,b)=>a+b.rating,0)/n).toFixed(1) : '–';
    const shown = data.filter(r=>r.approved).length;
    $('stats').innerHTML = `<div class="adm-stat"><b>${n}</b>Reviews</div><div class="adm-stat"><b>${avg} ★</b>Average</div><div class="adm-stat"><b>${shown}</b>Shown on site</div>`;
    $('rows').innerHTML = data.map(r => `<tr>
      <td>${esc(new Date(r.date).toLocaleDateString('en-IN'))}</td><td>${esc(r.name)}</td><td>${esc(r.contact)}</td>
      <td>${esc(r.service)}</td><td style="color:var(--gold)">${'★'.repeat(r.rating)}</td>
      <td>${esc(r.review)}</td><td>${esc(r.suggestions)}</td><td>${r.allowPublic?'Yes':'No'}</td>
      <td>${r.allowPublic?`<button class="pill ${r.approved?'on':''}" data-id="${esc(r.id)}">${r.approved?'Shown':'Hidden'}</button>`:'—'}</td></tr>`).join('')
      || '<tr><td colspan="9" style="text-align:center;color:var(--muted)">No reviews yet</td></tr>';
  }
  function logout(){ creds=null; sessionStorage.removeItem('sac_admin'); $('dash').style.display='none'; $('loginSec').style.display=''; $('logout').style.display='none'; }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault(); $('lBtn').disabled = true; $('lMsg').textContent='';
    creds = { username:$('u').value.trim(), password:$('p').value };
    if (creds.username !== ADMIN_USER || creds.password !== ADMIN_PASS) {
      creds = null; $('lMsg').textContent='Invalid username or password'; $('lMsg').className='rv-msg err'; $('lBtn').disabled = false; return;
    }
    try { if (await load()) sessionStorage.setItem('sac_admin', JSON.stringify(creds)); }
    catch(err){ $('lMsg').textContent='Server not reachable'; $('lMsg').className='rv-msg err'; }
    $('lBtn').disabled = false;
  });
  $('logout').onclick = logout;
  $('refresh').onclick = load;
  $('rows').addEventListener('click', async e => {
    const b = e.target.closest('.pill'); if (!b) return;
    const row = data.find(r => String(r.id) === b.dataset.id); const next = !row.approved;
    b.disabled = true; const r = await post({ action:'setApproved', id:row.id, approved:next });
    if (r.ok) { row.approved = next; render(); } else b.disabled = false;
  });
  $('csv').onclick = () => {
    const h = ['Date','Name','Contact','Service','Rating','Review','Suggestions','Allow Public','Shown on site'];
    const q = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
    const lines = [h.map(q).join(',')].concat(data.map(r => [new Date(r.date).toLocaleString('en-IN'), r.name, r.contact, r.service, r.rating, r.review, r.suggestions, r.allowPublic?'Yes':'No', r.approved?'Yes':'No'].map(q).join(',')));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' }));
    a.download = 'customer-reviews-' + new Date().toISOString().slice(0,10) + '.csv'; a.click();
  };
  if (creds) load().catch(logout);
})();
</script>
</body>
</html>
